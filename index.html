    <script>
      // Sandboxed Environment Fetch Hook Polyfill
      // Resolves 'Cannot set property fetch of #<Window> which has only a getter' errors
      (function() {
        try {
          var originalFetch = window.fetch;
          var customFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() { return customFetch; },
            set: function(val) { customFetch = val; },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          console.warn("Unable to patch window.fetch with custom setter:", e);
        }
      })();
    </script>
